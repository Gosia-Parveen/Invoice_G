<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin_Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
  <style>
    body {
      background: linear-gradient(to left, #faec87, #fcba95);
      padding-top: 70px;
      margin: 0;

    }

    .header {
      background-color: #e45b11;
      padding: 15px 30px;
      border-bottom: 2px solid;
      display: flex;
      align-items: center;
    }

    .header i {
      margin-right: 10px;
    }

    .card {
      margin-bottom: 30px;
    }

    .content-card {
      margin: 30px auto;
      max-width: 1000px;
      background: white;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    .navbar-brand {
      font-family: 'Brush Script MT', cursive;
    }

    #sidebar {
      position: fixed;
      top: 60px;
      left: 0;
      width: 250px;
      height: calc(100% - 60px);
      background-color: #b50001;
      transform: translateX(-100%);
      transition: transform 0.3s ease-in-out;
      z-index: 1040;
      overflow-y: auto;
    }

    #sidebar.show {
      transform: translateX(0);
    }

    .content-wrapper {
      transition: margin-left 0.3s ease-in-out;
    }

    .content-wrapper.shifted {
      margin-left: 250px;
    }
  </style>
</head>

<body>

  <!-- Navbar (Fixed and always visible) -->
  <nav class="navbar fixed-top text-white">
    <div class="container-fluid d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center">
        <button class="navbar-toggler" type="button" id="toggleSidebar" aria-label="Toggle navigation"
          style="background-color: #ef8d58;">
          <span class="navbar-toggler-icon"></span>
        </button>

        <h3
          style="color: #b50001; font-size: 30px; font-family: 'Times New Roman', Times, serif; padding-left: 1200px;">
          Invoice_G </h3>
      </div>
  </nav>

  <!-- Sidebar (Pushes content, appears below navbar) -->
  <div id="sidebar" class=" text-white">
    <div class="p-3 border-bottom d-flex justify-content-between align-items-center">
      <h5 class="mb-0">Billing_Admin</h5>
      <button type="button" class="btn-close btn-close-white" id="closeSidebar"></button>
    </div>
    <ul class="navbar-nav flex-column px-3">
      <li class="nav-item"><a class="nav-link" href="{% url 'admin_dash' %}">Dashboard</a></li>
      <li class="nav-item"><a class="nav-link" href="{% url 'subs_tab' %}">Subscription</a></li>
      <li class="nav-item"><a class="nav-link" href="#">Invoice</a></li>
      <li class="nav-item"><a class="nav-link" href="#">Account Manager</a></li>
      <li class="nav-item"><a class="nav-link" href="{% url 'logout' %}">LOGOUT</a></li>
    </ul>
  </div>

  <!-- Main Content -->
  <main class="container content-wrapper">

  </main>

  <!-- Script -->
  <script>
    const sidebar = document.getElementById('sidebar');
    const content = document.querySelector('.content-wrapper');
    const toggleBtn = document.getElementById('toggleSidebar');
    const closeBtn = document.getElementById('closeSidebar');

    // Load sidebar state on page load
    document.addEventListener("DOMContentLoaded", function () {
      if (localStorage.getItem('sidebarOpen') === 'true') {
        sidebar.classList.add('show');
        content.classList.add('shifted');
      }
    });

    toggleBtn.addEventListener('click', () => {
      const isOpen = sidebar.classList.toggle('show');
      content.classList.toggle('shifted', isOpen);
      localStorage.setItem('sidebarOpen', isOpen);
    });

    closeBtn.addEventListener('click', () => {
      sidebar.classList.remove('show');
      content.classList.remove('shifted');
      localStorage.setItem('sidebarOpen', false);
    });
  </script>


</body>

</html>
