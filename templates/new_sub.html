<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Add_new</title>

    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            width: 100%;
            background: linear-gradient(to left, #faec87, #fcba95);
            padding-top: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container1 {
            width: 530px;
            min-height: 350px;
            background-color: #fa7301;
            padding: 28px 20px;
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
            color: white;
        }

        .container1 form-label {
            font-size: 30px;
            color: pink;
            margin-left: 100px;
        }

        .btn1 {
            height: 50px;
            width: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f3b900;
            color: black;
        }

        .btn1:hover {
            background-color: #b50001;
            color: white;
        }
    </style>
</head>

<body>

    <div class="container1">

        <form method="POST">
            {% csrf_token %}

            <h2 style="text-align:center;">
                {% if subscription %}
                    Edit Subscription
                {% else %}
                    New Subscription
                {% endif %}
            </h2>

            <!--------------------------- CUSTOMER NAME --------------------------->
            <label for="customername" class="form-label">Customer Name</label>

            <input type="text"
                   class="form-control"
                   id="customername"
                   name="customer_name"
                   placeholder="Customer Name"
                   value="{{ subscription.customer_name|default:'' }}"
                   required>


            <!--------------------------- BILLING EMAIL --------------------------->
            <label for="billingemail" class="form-label">Billing Email</label>

            <input type="email"
                   class="form-control"
                   id="billingemail"
                   name="billing_email"
                   placeholder="Billing Email"
                   value="{{ subscription.billing_email|default:'' }}"
                   required>


            <!--------------------------- PLAN --------------------------->
            <label for="plan" class="form-label">Plan</label>

            <input type="text"
                   class="form-control"
                   id="plan"
                   name="plan"
                   placeholder="Plan"
                   value="{{ subscription.plan|default:'' }}"
                   required>


            <!--------------------------- BILLING CYCLE --------------------------->
            <label for="billingcycle" class="form-label">Billing Cycle</label>

            <select class="form-control"
                    id="billingcycle"
                    name="billing_cycle"
                    required>

                <option value="">Select Billing Cycle</option>

                <option value="Monthly"
                    {% if subscription.billing_cycle == "Monthly" %}
                        selected
                    {% endif %}>
                    Monthly
                </option>

                <option value="Yearly"
                    {% if subscription.billing_cycle == "Yearly" %}
                        selected
                    {% endif %}>
                    Yearly
                </option>

            </select>


            <!--------------------------- PRICE --------------------------->
            <label for="price" class="form-label">Price</label>

            <input type="number"
                   class="form-control"
                   id="price"
                   name="price"
                   placeholder="Price"
                   value="{{ subscription.price|default:'' }}"
                   step="0.01"
                   required>


            <!--------------------------- START DATE --------------------------->
            <label for="startdate" class="form-label">Start Date</label>

            <input type="date"
                   class="form-control"
                   id="startdate"
                   name="start_date"
                   value="{{ subscription.start_date|date:'Y-m-d' }}"
                   required>


            <!--------------------------- OWNER --------------------------->
            <label for="ownername" class="form-label">Owner</label>

            <select class="form-control"
                    id="ownername"
                    name="owner"
                    required>

                <option value="">Select Account Manager</option>

                {% for user in account_managers %}

                    <option value="{{ user.id }}"
                        {% if subscription.owner_id == user.id %}
                            selected
                        {% endif %}>
                        {{ user.username }}
                    </option>

                {% endfor %}

            </select>


            <!--------------------------- BUTTONS --------------------------->
            <div class="d-flex justify-content-center gap-3 mt-3">

                <button class="btn btn-danger btn1" type="submit">
                    Submit
                </button>

                <a class="btn btn-danger btn1"
                   href="{% url 'subs_tab' %}"
                   role="button">
                    Go Back
                </a>

            </div>

        </form>

    </div>

</body>

</html>
