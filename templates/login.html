<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <title>Login Page</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            width: 100%;
            background: linear-gradient(to left, #ff9408, #95122c);

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Login Box */
        .login {
            width: 330px;
            min-height: 350px;
            background-color: #a70c0c;
            padding: 28px 20px;
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
            color: white;
            
        }

        /* Heading */
        .login h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
            color: white;
            text-align: center;
        }
        .login h4 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 5px;
            color: white;
            text-align: left;
        }
        /* Input boxes */
        .input-box {
            position: relative;
            margin-bottom: 10px;
        }

        .input-box input {
            height: 36px;
            width: 100%;
            padding: 0 40px 0 12px;
            border-radius: 9px;
            border: 1px solid rgba(255, 255, 255, 0.55);
            background: rgba(255, 255, 255, 0.08);
            color: white;
            outline: none;
        }
        
        /* Login button */
        .login .btn {
            width: 100%;
            height: 45px;

            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.5);

            background: linear-gradient(to right, #eeaa11, #e7e4de);
            color: black;

            font-weight: 600;
            font-size: 20px;
            margin: 0;
        }

        .login .btn:hover {
            background: linear-gradient(to right, #ee1166, #f095cf);
        }

        
        /* ---------- MOBILE RESPONSIVENESS ---------- */
        @media (max-width: 768px) {

            body {
                padding: 15px;
            }

            .login {
                width: 100%;
                max-width: 330px;
                min-height: auto;
                padding: 25px 18px;
            }

            .login h1 {
                font-size: 25px;
            }

            .login h4 {
                font-size: 18px;
            }

            .input-box input {
                height: 42px;
            }

            .login .btn {
                height: 45px;
                font-size: 18px;
            }
        }
        
    </style>
</head>


<body>

    <div class="login">

        <h1>Login</h1>
        <p> Welcome back, please login to your account</p>

        <form method="post">
            {% csrf_token %}
        <!-- Username -->
        <div class="input-box">
            <h4>Email</h4>
            <input type="email" name="email" placeholder="User Email">
        </div>


        <!-- Password -->
        <div class="input-box">
            <h4>Password</h4>
            <input type="password" name="password" placeholder="Password">
        </div>
        <br>
        <br>
        <!-- Login button -->
        <button type="submit" class="btn">
            Login
        </button>
        </form>


    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
